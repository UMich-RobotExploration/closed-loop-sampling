# AS-RUN recipe of the released CCS DC-AE checkpoint (overlay for
# scripts/train_dcae.py --region ccs --config this-file).
# Production selection: best-on-val (epoch 10, val_loss 0.019274); EMA at inference.
region: ccs
seed: 42

pretrain_epochs: 30
decoder_finetune_epochs: 0       # explicitly zero in the production run
lr_pretrain: 1.0e-4
lr_finetune: 1.0e-5
warmup_steps: 1000
lr_cosine_cycles: 0.5
optimizer_betas: [0.9, 0.999]
optimizer_eps: 1.0e-8
weight_decay: 0.01
gradient_clip_norm: 1.0

train_year_range: [1980, 2014]
val_year_range: [2015, 2015]

batch_size_per_device: 4
gradient_accumulation_steps: 1
num_workers: 4

ema_decay: 0.9999
ema_use_warmup: true
ema_update_after_step: 1000
ema_inv_gamma: 1.0
ema_power: 0.667

mixed_precision: bf16
checkpoint_every_n_epochs: 5
keep_last_n_checkpoints: 3
save_best_val: true
val_every_n_epochs: 2
val_max_batches: 200
